```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIZZ | Matrix</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  height: 100vh;
  font-family: Arial, sans-serif;
}

#matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

h1 {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #00ff41;
  font-size: clamp(60px, 15vw, 130px);
  letter-spacing: 12px;
  text-shadow: 0 0 10px #00ff41, 0 0 30px #00ff41,
               0 0 60px #00ff41;
  z-index: 2;
  user-select: none;
}

#music {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 22px;
  background: #001a00;
  color: #00ff41;
  border: 1px solid #00ff41;
  border-radius: 8px;
  cursor: pointer;
  z-index: 5;
  font-size: 15px;
  box-shadow: 0 0 12px #00ff41;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<h1>LIZZ</h1>



<audio id="song" autoplay loop preload="auto">
  <source src="https://raw.githubusercontent.com/Lizzexe/lizz-matrix/main/BERAT%20%C3%96ZKAN.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let width, height, columns, drops;
const fontSize = 16;
const chars = "アカサタナハマヤラワ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  columns = Math.ceil(width / fontSize);
  drops = Array.from({length: columns}, () =>
    Math.random() * (height / fontSize) * -1
  );
}

window.addEventListener("resize", resize);
resize();

function drawMatrix() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "#00ff41";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const char = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(char, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > height && Math.random() > 0.975) {
      drops[i] = 0;
    }

    drops[i] += 0.7;
  }

  requestAnimationFrame(drawMatrix);
}

drawMatrix();

/* Fare izi */
const trail = [];

window.addEventListener("pointermove", (event) => {
  for (let i = 0; i < 3; i++) {
    trail.push({
      x: event.clientX + (Math.random() - 0.5) * 12,
      y: event.clientY + (Math.random() - 0.5) * 12,
      life: 1,
      size: Math.random() * 4 + 1
    });
  }
});

function drawTrail() {
  for (let i = trail.length - 1; i >= 0; i--) {
    const p = trail[i];
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = "#00ff41";
    ctx.shadowColor = "#00ff41";
    ctx.shadowBlur = 12;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.restore();

    p.life -= 0.035;
    if (p.life <= 0) trail.splice(i, 1);
  }
  requestAnimationFrame(drawTrail);
}

drawTrail();

/* Müzik düğmesi */
const song = document.getElementById("song");
const button = document.getElementById("music");

button.addEventListener("click", async () => {
  try {
    if (song.paused) {
      await song.play();
      button.textContent = "⏸ MÜZİĞİ DURDUR";
    } else {
      song.pause();
      button.textContent = "▶ MÜZİĞİ BAŞLAT";
    }
  } catch (error) {
    button.textContent = "MÜZİK AÇILMADI - TEKRAR DENE";
    console.error("Müzik hatası:", error);
  }
});
</script>

</body>
</html>
