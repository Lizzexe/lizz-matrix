```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIZZ MATRIX</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  overflow: hidden;
  height: 100vh;
  font-family: Arial, sans-serif;
}

#matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

h1 {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #00ff41;
  font-size: clamp(60px, 15vw, 130px);
  letter-spacing: 12px;
  text-shadow: 0 0 10px #00ff41, 0 0 30px #00ff41, 0 0 60px #00ff41;
  z-index: 2;
  pointer-events: none;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #00ff41, 0 0 25px #00ff41; }
  to { text-shadow: 0 0 20px #00ff41, 0 0 50px #00ff41, 0 0 80px #00ff41; }
}

#music {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 22px;
  background: #001a00;
  color: #00ff41;
  border: 1px solid #00ff41;
  border-radius: 8px;
  cursor: pointer;
  z-index: 5;
  font-size: 15px;
  box-shadow: 0 0 12px #00ff41;
}
</style>
</head>

<body>
<canvas id="matrix"></canvas>
<h1>LIZZ</h1>
<button id="music">▶ MÜZİĞİ BAŞLAT</button>

<audio id="song" autoplay loop preload="auto">
  <source src="https://raw.githubusercontent.com/Lizzexe/lizz-matrix/main/BERAT%20%C3%96ZKAN.mp3" type="audio/mpeg">
</audio>

<script>
/* MATRIX YAGMURU */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
let width, height, drops;
const fontSize = 16;
const chars = "アカサタナハマヤラワ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  drops = Array.from(
    { length: Math.ceil(width / fontSize) },
    () => Math.random() * -50
  );
}
window.addEventListener("resize", resize);
resize();

function drawMatrix() {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = "#00ff41";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    ctx.fillText(chars[Math.floor(Math.random() * chars.length)],
                 i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i] += 0.7;
  }
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

/* FARE IZLERI */
const trail = [];
window.addEventListener("pointermove", event => {
  for (let i = 0; i < 3; i++) {
    trail.push({
      x: event.clientX + (Math.random() - 0.5) * 12,
      y: event.clientY + (Math.random() - 0.5) * 12,
      life: 1,
      size: Math.random() * 4 + 1
    });
  }
});

function drawTrail() {
  for (let i = trail.length - 1; i >= 0; i--) {
    const p = trail[i];
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = "#00ff41";
    ctx.shadowColor = "#00ff41";
    ctx.shadowBlur = 12;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.restore();
    p.life -= 0.035;
    if (p.life <= 0) trail.splice(i, 1);
  }
  requestAnimationFrame(drawTrail);
}
drawTrail();

/* MUZIK VE OTOMATIK BASLATMA */
const song = document.getElementById("song");
const button = document.getElementById("music");

function updateButton() {
  button.textContent = song.paused
    ? "▶ MÜZİĞİ BAŞLAT"
    : "⏸ MÜZİĞİ DURDUR";
}

async function startMusic() {
  try {
    await song.play();
    updateButton();
  } catch (error) {
    updateButton();
  }
}

/* Site yuklenir yuklenmez baslatmayi dene */
startMusic();
window.addEventListener("load", startMusic);
document.addEventListener("DOMContentLoaded", startMusic);

/* Butonla baslat / durdur */
button.addEventListener("click", async () => {
  if (song.paused) {
    await startMusic();
  } else {
    song.pause();
    updateButton();
  }
});

/* Tarayici otomatik oynatmayi engellerse ilk etkilesimde dene */
document.addEventListener("pointerdown", function firstInteraction() {
  if (song.paused) startMusic();
}, { once: true });
</script>
</body>
</html>
