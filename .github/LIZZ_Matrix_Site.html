<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIZZ</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; }
  body { font-family: Consolas, "Courier New", monospace; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .shade { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.18), rgba(0,0,0,.8)); pointer-events: none; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .logo { font-size: clamp(4rem, 15vw, 12rem); font-weight: 900; letter-spacing: .06em; color: #ff64c8; text-shadow: 0 0 8px #ff4ab8, 0 0 24px rgba(255,60,180,.65); line-height: 1; }
  .subtitle { margin-top: 24px; color: #ff65c7; font-size: clamp(.75rem, 2vw, 1.1rem); letter-spacing: .12em; }
  .subtitle span { color: #fff; }
  .controls { position: fixed; right: 18px; bottom: 16px; display: flex; gap: 8px; align-items: center; }
  button, .file-label { font: inherit; font-size: 12px; letter-spacing: .08em; color: #fff; background: rgba(10,10,10,.8); border: 1px solid #ff65c7; border-radius: 24px; padding: 10px 15px; cursor: pointer; box-shadow: 0 0 12px rgba(255,70,190,.25); }
  button:hover, .file-label:hover { background: rgba(255,65,180,.18); }
  #musicFile { display: none; }
  .hint { position: fixed; left: 16px; bottom: 16px; color: #aaa; font-size: 11px; }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="shade"></div>
<main class="center">
  <div class="logo">LIZZ</div>
  <div class="subtitle">WELCOME TO <span>LIZZ</span></div>
</main>
<div class="hint">Müziği başlatmak için MP3 seç, sonra MÜZİK düğmesine bas.</div>
<div class="controls">
  <label class="file-label" for="musicFile">MP3 SEÇ</label>
  <input id="musicFile" type="file" accept="audio/*">
  <button id="toggleMusic">♫ MÜZİK: KAPALI</button>
</div>
<audio id="audio" loop></audio>
<script>
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let width, height, columns, drops;
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+';
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth; height = window.innerHeight;
  canvas.width = width * dpr; canvas.height = height * dpr;
  canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  columns = Math.ceil(width / 18);
  drops = Array.from({length: columns}, () => Math.random() * -height / 18);
}
window.addEventListener('resize', resize);
resize();
function draw() {
  ctx.fillStyle = 'rgba(4, 4, 6, 0.09)';
  ctx.fillRect(0, 0, width, height);
  ctx.font = '14px Consolas, monospace';
  for (let i = 0; i < drops.length; i++) {
    const ch = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillStyle = Math.random() > .82 ? '#ff76ce' : '#62515f';
    ctx.fillText(ch, i * 18, drops[i] * 18);
    if (drops[i] * 18 > height && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 0.45 + Math.random() * 0.55;
  }
  requestAnimationFrame(draw);
}
draw();

const audio = document.getElementById('audio');
const picker = document.getElementById('musicFile');
const toggle = document.getElementById('toggleMusic');
let musicUrl = null;
picker.addEventListener('change', () => {
  const file = picker.files[0];
  if (!file) return;
  if (musicUrl) URL.revokeObjectURL(musicUrl);
  musicUrl = URL.createObjectURL(file);
  audio.src = musicUrl;
  toggle.textContent = '♫ MÜZİK: HAZIR';
});
toggle.addEventListener('click', async () => {
  if (!audio.src) {
    picker.click();
    return;
  }
  if (audio.paused) {
    try { await audio.play(); toggle.textContent = '♫ MÜZİK: AÇIK'; }
    catch { toggle.textContent = '♫ TEKRAR DENE'; }
  } else {
    audio.pause();
    toggle.textContent = '♫ MÜZİK: KAPALI';
  }
});
</script>
</body>
</html>
